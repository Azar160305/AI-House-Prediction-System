{% extends 'base.html' %}{% block title %}Sign in{% endblock %}{% block content %}<div class="auth-shell"><a class="brand" href="{{ url_for('home') }}"><span class="brand-icon">⌂</span><span>Nestwise<small>SMART HOUSE PLANNER</small></span></a><h1 class="mt-4">Welcome back</h1><p>Sign in to continue with your home plans.</p><form method="post" class="mt-4" novalidate><label class="field-label" for="email">Email address</label><input class="form-control mb-3" id="email" name="email" type="email" autocomplete="email" maxlength="160" value="{{ request.form.get('email','') }}" required><label class="field-label" for="password">Password</label><input class="form-control mb-3" id="password" name="password" type="password" autocomplete="current-password" required><button class="btn btn-primary w-100" type="submit">Sign in</button></form><div class="mt-3 small text-center"><a href="{{ url_for('forgot_password') }}">Forgot password?</a><br>New to Nestwise? <a href="{{ url_for('register') }}">Create an account</a></div></div>{% endblock %}
