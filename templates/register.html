{% extends 'base.html' %}{% block title %}Create account{% endblock %}{% block content %}<div class="auth-shell"><a class="brand" href="{{ url_for('home') }}"><span class="brand-icon">⌂</span><span>Nestwise<small>SMART HOUSE PLANNER</small></span></a><h1 class="mt-4">Create your account</h1><p>Save your predictions and keep your project details together.</p><form method="post" class="mt-4" novalidate><label class="field-label" for="full_name">Full name</label><input class="form-control mb-3" id="full_name" name="full_name" autocomplete="name" maxlength="100" value="{{ form.get('full_name','') }}" required><label class="field-label" for="email">Email address</label><input class="form-control mb-3" id="email" name="email" type="email" autocomplete="email" maxlength="160" value="{{ form.get('email','') }}" required><label class="field-label" for="phone">Phone number</label><input class="form-control mb-3" id="phone" name="phone" type="tel" autocomplete="tel" maxlength="25" placeholder="+91 98765 43210" value="{{ form.get('phone','') }}" required><label class="field-label" for="password">Password</label><input class="form-control mb-3" id="password" name="password" type="password" autocomplete="new-password" minlength="8" maxlength="128" required><label class="field-label" for="confirm_password">Confirm password</label><input class="form-control mb-3" id="confirm_password" name="confirm_password" type="password" autocomplete="new-password" minlength="8" maxlength="128" required><button class="btn btn-primary w-100" type="submit">Register</button></form><div class="mt-3 small text-center">Already registered? <a href="{{ url_for('login') }}">Sign in</a></div></div>{% endblock %}
